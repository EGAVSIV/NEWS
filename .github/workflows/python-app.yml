name: Market News Bot

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Bot
        run: python newstotelegram.py

      - name: Commit updated news database
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sent_news.json
          git commit -m "Update sent news database" || echo "No changes"
          git push
